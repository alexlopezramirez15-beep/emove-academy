[build]
  command = "python3 build.py"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/app/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The public website is a single landing page: old page addresses go to its sections.
[[redirects]]
  from = "/guides/*"
  to = "/#guides"
  status = 301

[[redirects]]
  from = "/resources/*"
  to = "/#resources"
  status = 301

[[redirects]]
  from = "/privacy/*"
  to = "/#privacy"
  status = 301
