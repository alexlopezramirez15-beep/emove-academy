<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMOVE Profe</title>
<meta name="description" content="Free Erasmus+ training and classroom resources for European teachers, by eMove Academy.">
<meta name="theme-color" content="#101C38"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EMOVE Profe"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>/* ============ EMOVE Profe · visual system (eMove brand: EU blue, navy, yellow, cream; Inter) ============ */
:root {
  --navy: #101C38; --navy-2: #071A32; --blue: #1965B8; --blue-d: #1458A3; --blue-l: #E8F0FA; --yellow: #FFCA05; --yellow-l: #FFF6D1;
  --cream: #F6F3EE; --card: #FFFFFF; --ink: #101C38; --muted: #526078; --line: #DCE2E9; --line-2: #EEF2F5;
  --ok: #15803D; --ok-l: #E7F6EC; --bad: #B42318; --bad-l: #FDECEA;
  --r: 16px; --r-s: 10px; --shadow: 0 1px 2px rgba(16, 28, 56, .06), 0 8px 24px rgba(16, 28, 56, .06);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--cream); font-size: 16px; line-height: 1.55; }
a { color: var(--blue); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; }
h2 { font-size: 21px; font-weight: 750; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0 0 .8em; }
.ic { width: 20px; height: 20px; flex: none; vertical-align: -4px; }
.ic.big { width: 40px; height: 40px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; justify-content: center; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; flex-wrap: wrap; }
.gap { gap: 10px; }
.hp { position: absolute; left: -9999px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
.eyebrow .ic { width: 16px; height: 16px; }
.optional { font-weight: 400; color: var(--muted); font-size: 13px; }

/* ---------- logo, header, nav ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); }
.logo-t { font-size: 19px; letter-spacing: .01em; color: var(--navy); }
.logo-t b { font-weight: 800; color: var(--blue); }
.brand { text-decoration: none; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px; padding: 10px max(16px, calc((100vw - 1160px) / 2)); background: rgba(246, 243, 238, .92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { position: relative; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
.nav a:hover { background: var(--line-2); color: var(--navy); }
.nav a.on { background: var(--navy); color: #fff; }
.nav em { font-style: normal; background: var(--yellow); color: var(--navy); font-size: 11px; font-weight: 800; border-radius: 999px; padding: 0 6px; }
.nav em:empty { display: none; }
.view { max-width: 1160px; margin: 0 auto; padding: 28px 16px 64px; }
.foot { max-width: 1160px; margin: 0 auto; padding: 24px 16px 96px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 860px) {
  .top { padding: 10px 16px; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; justify-content: space-around; gap: 0; background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; border-radius: 10px; flex: 1; text-align: center; }
  .nav a.on { background: var(--blue-l); color: var(--blue); }
  .nav em { position: absolute; top: 2px; right: 18%; }
}

/* ---------- basics ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; box-shadow: var(--shadow); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; color: var(--navy); font: 600 15px var(--font); text-decoration: none; cursor: pointer; transition: transform .08s, background .15s; }
.btn:hover { border-color: var(--navy); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.primary:hover { background: var(--blue-d); }
.btn.on { background: var(--yellow); border-color: var(--yellow); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.sm { min-height: 36px; padding: 6px 14px; font-size: 14px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; text-decoration: none; }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-weight: 600; margin-bottom: 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 650; padding: 4px 10px; border-radius: 999px; color: var(--c, var(--blue)); background: color-mix(in srgb, var(--c, var(--blue)) 10%, #fff); }
.chip .ic { width: 15px; height: 15px; }
.bar { height: 8px; border-radius: 9px; background: var(--line-2); overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 9px; }
.ring-bg { fill: none; stroke: var(--line-2); stroke-width: 8; }
.ring-fg { fill: none; stroke: var(--blue); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring text { font: 800 18px var(--font); fill: var(--navy); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin: 16px 0; }
@media (max-width: 900px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.page-h { margin-bottom: 20px; }
.page-h h1 { display: flex; align-items: center; gap: 10px; }
.page-h h1 .ic { width: 30px; height: 30px; color: var(--blue); }
.sec-t { margin: 32px 0 4px; }
.sec-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
.sec-row .sec-t { margin-bottom: 0; }
.empty { padding: 24px 0; }
.disclaimer { font-size: 13px; color: var(--muted); border-left: 3px solid var(--yellow); padding: 6px 12px; margin-top: 28px; }
.notice { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--r-s); background: var(--yellow-l); border: 1px solid #F3DC85; margin-bottom: 16px; font-size: 14px; }
.notice.rejected { background: var(--bad-l); border-color: #F5C2BC; }
.err { color: var(--bad); font-size: 14px; min-height: 1em; margin: 0; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.sheet-bg { position: fixed; inset: 0; background: rgba(7, 26, 50, .45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.sheet { position: relative; background: #fff; border-radius: var(--r); padding: 24px; max-width: 460px; width: 100%; }
.sheet .x, .icon-btn { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--line-2); display: grid; place-items: center; cursor: pointer; color: var(--navy); }
.temp { font: 700 24px ui-monospace, monospace; letter-spacing: .08em; background: var(--yellow-l); padding: 12px; border-radius: var(--r-s); text-align: center; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 14px; }
.form small { font-weight: 400; color: var(--muted); }
input, select, textarea { font: 16px var(--font); color: var(--ink); padding: 11px 12px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: #fff; width: 100%; }
input:focus, select:focus, textarea:focus { outline: 3px solid color-mix(in srgb, var(--blue) 25%, transparent); border-color: var(--blue); }
textarea { resize: vertical; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.form label.check, label.check { flex-direction: row; align-items: flex-start; gap: 10px; font-weight: 400; font-size: 14px; }
.checks label.check { border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; align-items: center; }
.checks label.check:has(input:checked) { border-color: var(--blue); background: var(--blue-l); }
label.check input { width: 18px; height: 18px; margin: 2px 0 0; flex: none; accent-color: var(--blue); }
label.check.inline { align-items: center; white-space: nowrap; }
.search { display: flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); border-radius: 999px; padding: 0 14px; background: #fff; flex: 1; min-width: 200px; }
.search input { border: 0; padding: 10px 0; outline: none; }
.search.wide { max-width: 520px; margin-bottom: 16px; }
.tabs { display: inline-flex; background: var(--line-2); border-radius: 999px; padding: 4px; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; font: 600 14px var(--font); padding: 8px 14px; border-radius: 999px; cursor: pointer; color: var(--muted); }
.tabs button.on { background: #fff; color: var(--navy); box-shadow: var(--shadow); }
.tabs em { font-style: normal; color: var(--muted); font-weight: 500; }

/* ---------- auth ---------- */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-side { background: var(--navy); color: #fff; padding: 40px clamp(24px, 5vw, 64px); display: flex; flex-direction: column; gap: 28px; }
.auth-side .logo-t { color: #fff; }
.auth-side .logo-t b { color: var(--yellow); }
.auth-side h1 { font-size: clamp(26px, 3.4vw, 40px); max-width: 520px; }
.auth-side a { color: var(--yellow); }
.sell { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; max-width: 520px; }
.sell li { display: flex; gap: 14px; }
.sell .ic { width: 26px; height: 26px; color: var(--yellow); margin-top: 2px; }
.sell b { display: block; }
.sell span { color: #C9D3E3; font-size: 15px; }
.auth-side .small { margin-top: auto; color: #C9D3E3; }
.auth-main { display: grid; place-items: center; padding: 32px 16px; }
.auth-card { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
.auth-card .tabs { align-self: flex-start; }
.done-box { text-align: center; padding: 12px 0; }
.ic.ok { color: var(--ok); }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .auth-side { padding: 24px 16px; gap: 18px; } .auth-side .sell, .auth-side .small { display: none; } }

/* ---------- home ---------- */
.welcome { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 18px; }
.welcome > div:first-child { max-width: 620px; }
.lv { min-width: 240px; padding: 14px 18px; }
.lv-n { display: inline-block; background: var(--yellow); color: var(--navy); font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-right: 6px; }
.continue { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-left: 6px solid var(--yellow); }
.continue h2 { margin: 0 0 4px; }
.continue p { margin: 0; }
@media (max-width: 560px) { .continue { gap: 14px; } .continue .grow { flex: 1 1 calc(100% - 110px); min-width: 0; } .continue > .btn, .continue > a.btn, .continue > div:last-child:not(.grow) { width: 100%; } .continue .btn { width: 100%; justify-content: center; } }
.deadline { background: linear-gradient(135deg, #fff 60%, var(--yellow-l)); }

/* ---------- academy ---------- */
.course-hero { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--navy); color: #fff; border-radius: 24px; padding: clamp(22px, 4vw, 40px); margin-bottom: 28px; }
.course-hero > div:first-child { max-width: 640px; }
.course-hero .eyebrow { color: var(--yellow); }
.course-hero p { color: #D5DDEA; font-size: 18px; }
.course-hero .meta { display: flex; align-items: center; gap: 8px; color: #C9D3E3; font-size: 14px; margin-bottom: 18px; }
.course-hero .btn:not(.primary) { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .4); }
.course-hero .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--navy); }
.hero-ring { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #C9D3E3; font-size: 14px; }
.hero-ring .ring-bg { stroke: rgba(255, 255, 255, .15); }
.hero-ring .ring-fg { stroke: var(--yellow); }
.hero-ring .ring text { fill: #fff; font-size: 26px; }
.path { list-style: none; padding: 0; margin: 0; position: relative; display: grid; gap: 14px; }
.path::before { content: ""; position: absolute; left: 31px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
.node-a { position: relative; display: flex; align-items: center; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 18px 14px 10px; text-decoration: none; color: inherit; box-shadow: var(--shadow); }
a.node-a[href]:hover { border-color: var(--blue); }
.node-dot { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--line-2); color: var(--muted); flex: none; z-index: 1; }
.node-dot.big { width: 64px; height: 64px; background: var(--blue); color: #fff; }
.node-dot.big .ic { width: 30px; height: 30px; }
.node.open .node-dot { background: var(--blue); color: #fff; box-shadow: 0 0 0 5px var(--blue-l); }
.node.done .node-dot { background: var(--ok); color: #fff; }
.node.locked .node-a { opacity: .6; box-shadow: none; }
.node-b { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.node-b .eyebrow { margin: 0; }
.node-n { font-size: 13px; color: var(--muted); white-space: nowrap; }
@media (max-width: 560px) { .node-n { display: none; } }
.soon { box-shadow: none; background: transparent; border-style: dashed; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.soon .chip { --c: #8A6D00; background: var(--yellow-l); }
.unit-h { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
.acts { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; }
.act-row { display: flex; align-items: center; gap: 14px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: inherit; }
.act-row:hover { border-color: var(--blue); }
.act-row > div { flex: 1; display: flex; flex-direction: column; }
.act-row .eyebrow { margin: 0; }
.act-i { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--blue-l); color: var(--blue); flex: none; }
.act-row.done .act-i { background: var(--ok-l); color: var(--ok); }

/* lesson player */
.player { max-width: 760px; margin: 0 auto; }
.player-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.player-top .icon-btn { position: static; }
.steps { flex: 1; display: flex; gap: 5px; }
.steps i { flex: 1; height: 8px; border-radius: 9px; background: var(--line); }
.steps i.done { background: var(--ok); }
.steps i.now { background: var(--blue); }
.xp-pill { display: inline-flex; gap: 4px; align-items: center; font-weight: 700; font-size: 14px; background: var(--yellow); padding: 4px 10px; border-radius: 999px; }
.xp-pill .ic { width: 16px; height: 16px; }
.act { padding: clamp(20px, 4vw, 32px); scroll-margin-bottom: 120px; }
.fb { scroll-margin-bottom: 120px; }
.act h2 { font-size: clamp(20px, 3vw, 26px); }
.lead { font-size: 18px; }
.player-foot { position: sticky; bottom: 0; padding: 14px 0; background: linear-gradient(transparent, var(--cream) 30%); }
@media (max-width: 860px) { .player-foot { bottom: 64px; } }
.points { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 10px; }
.points li { display: flex; gap: 10px; }
.points .ic { color: var(--ok); margin-top: 2px; }
.tip { display: flex; gap: 12px; background: var(--yellow-l); border-radius: var(--r-s); padding: 14px; margin-top: 16px; }
.tip .ic { color: #9A7400; }
.tip p { margin: 0; }
.scenario { display: flex; gap: 12px; background: var(--blue-l); border-radius: var(--r-s); padding: 14px; margin-bottom: 14px; }
.scenario .ic { color: var(--blue); margin-top: 2px; }
.scenario p { margin: 0; font-weight: 500; }
.opts { display: grid; gap: 10px; margin: 14px 0; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font: 500 16px var(--font); color: var(--ink); cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue); }
.opt-l { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--line-2); font-weight: 800; flex: none; }
.opt.sel { border-color: var(--blue); background: var(--blue-l); }
.opt.sel .opt-l { background: var(--blue); color: #fff; }
.opt.right { border-color: var(--ok); background: var(--ok-l); }
.opt.right .opt-l { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-l); }
.opt.wrong .opt-l { background: var(--bad); color: #fff; }
.fb { display: flex; gap: 12px; padding: 14px; border-radius: var(--r-s); margin-top: 12px; animation: pop .25s; }
.fb .ic { flex: none; margin-top: 2px; }
.fb.ok { background: var(--ok-l); } .fb.ok > .ic { color: var(--ok); }
.fb.no { background: var(--bad-l); } .fb.no > .ic { color: var(--bad); }
.fb ol { margin: 6px 0; padding-left: 20px; }
@keyframes pop { from { transform: translateY(6px); opacity: 0; } }
.flip-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 12px; }
.flip { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; min-height: 150px; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--navy); color: #fff; font: 16px var(--font); cursor: pointer; transition: background .25s; }
.flip-i { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, .12); color: var(--yellow); }
.flip-d { display: none; font-size: 15px; }
.flip-hint { margin-top: auto; font-size: 13px; color: #C9D3E3; }
.flip.open { background: #fff; color: var(--ink); border-color: var(--blue); }
.flip.open .flip-i { background: var(--blue-l); color: var(--blue); }
.flip.open .flip-d { display: block; }
.flip.open .flip-hint { display: none; }
.tf { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 12px; counter-reset: tf; }
.tf li { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; }
.tf li.right { border-color: var(--ok); } .tf li.wrong { border-color: var(--bad); }
.tf p { font-weight: 500; }
.tf-b { display: flex; gap: 8px; }
.tf-b button { flex: 1; min-height: 42px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font: 600 15px var(--font); cursor: pointer; }
.tf-b button.sel { background: var(--navy); color: #fff; border-color: var(--navy); }
.pool { display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 12px; border-radius: 14px; background: var(--line-2); margin: 10px 0 14px; }
.tile { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 9px 12px; font: 500 15px var(--font); color: var(--ink); text-align: left; cursor: pointer; box-shadow: 0 1px 2px rgba(16, 28, 56, .08); }
.tile.sel { border-color: var(--blue); background: var(--blue); color: #fff; transform: translateY(-2px); }
.tile small { display: block; font-size: 12px; color: var(--bad); margin-top: 2px; }
.tile.right { border-color: var(--ok); background: var(--ok-l); }
.tile.wrong { border-color: var(--bad); background: var(--bad-l); }
.buckets { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .buckets { grid-template-columns: 1fr; } }

/* ---------- state (per device, synced to the account) ---------- */
const KEY = "emove-profe-v1";
const freshState = () => ({ xp: 0, done: {}, units: {}, notes: {}, favs: [], quiz: null, certs: [], clicks: {}, syl: {}, days: [], log: [] });
let S = (() => { try { return Object.assign(freshState(), JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) { return freshState(); } })();
let USER = null;      // signed-in account (from the server)
function summary() {
  const c = COURSES[0];
  return { xp: S.xp, units: c.units.filter(u => S.units[u.id]).length, of: c.units.length, quiz: S.quiz, certs: S.certs.length, favs: S.favs.length, clicks: Object.keys(S.clicks).length, syl: Object.keys(S.syl || {}).length, last: todayISO() };
}
function save(sync = true) {
  S.summary = summary();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  if (sync && typeof syncPush === "function") syncPush();
}
function logAct(t) { S.log.unshift({ t, d: todayISO() }); S.log = S.log.slice(0, 40); }
function addXP(n, why) {
  S.xp += n;
  if (!S.days.includes(todayISO())) S.days.push(todayISO());
  if (why) logAct(why);
  save();
}
const level = () => { const xp = S.xp; const lv = xp < 60 ? 1 : xp < 160 ? 2 : xp < 320 ? 3 : xp < 520 ? 4 : 5; return { lv, name: ["Explorer", "Planner", "Applicant", "Mobility pro", "Erasmus+ champion"][lv - 1], next: [60, 160, 320, 520, null][lv - 1] }; };

/* ---------- UI helpers ---------- */
function toast(msg) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }

}
function sheet(html, cls = "") {

const NAV_OF = { academy: "learn", unit: "learn", lesson: "learn", quiz: "learn", glossary: "learn", cert: "learn", course: "learn", courses: "learn", res: "resources", space: "community", thread: "community", members: "community" };

const ROUTES = {};
function route() {
  const h = (location.hash || "#home").slice(1).split("/");
  const fn = ROUTES[h[0]] || ROUTES.home;
  $$("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === (NAV_OF[h[0]] || h[0])));

}

/* ============ ACCOUNTS: request access, super-admin approval, sign in and sync ============
   On the published site every teacher requests access and can only enter once the super-admin approves it.
   Opened as a local file, or on a host without the API, the app runs in preview mode with no accounts. */
const AUTH_KEY = "emove-profe-auth";
let AUTH = (() => { try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; } catch (e) { return null; } })();
let PREVIEW = false;
let REV = 0;
function authSave(a) { AUTH = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) { } }
async function api(path, body, method) {
  const headers = { "content-type": "application/json" };
  if (AUTH && AUTH.token) headers.authorization = "Bearer " + AUTH.token;
  let r;
  try { r = await fetch("/api/" + path, { method: method || (body ? "POST" : "GET"), headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { return { net: true, ok: false, status: 0, data: { message: "No connection. Check your internet and try again." } }; }
  let data = {}; try { data = await r.json(); } catch (e) { data = { message: "The server is not answering. Please try again in a moment." }; }
  return { ok: r.ok, status: r.status, data };
}
/* progress is kept per device: if another account signs in, the previous one is set aside */
function adoptUser(u) {
  if (S.owner && S.owner !== u.email) {
    try { localStorage.setItem(KEY + ":" + S.owner, JSON.stringify(S)); const raw = localStorage.getItem(KEY + ":" + u.email); S = raw ? Object.assign(freshState(), JSON.parse(raw)) : freshState(); }
    catch (e) { S = freshState(); }
    REV = 0;
  }
  S.owner = u.email; USER = u;
  try { REV = +localStorage.getItem(KEY + ":rev:" + u.email) || 0; } catch (e) { }
  save(false);
}
async function accountsBoot(next) {
  const online = /^https?:$/.test(location.protocol);
  const ping = online ? await api("ping") : { ok: false };
  if (!ping.ok && !(ping.net && AUTH)) {
    PREVIEW = true; USER = { name: "Preview", email: "preview", admin: false, preview: true }; S.owner = S.owner || "preview";
    next(); toast("Preview mode: accounts are switched off on this copy.");
    return;
  }
  if (AUTH && AUTH.token && AUTH.user) {
    adoptUser(AUTH.user); next();
    const r = await api("me");
    if (r.net) return; // offline: keep the saved account
    if (r.ok) { const wasAdmin = !!USER.admin; AUTH.user = r.data.user; authSave(AUTH); adoptUser(r.data.user); if (wasAdmin !== !!USER.admin) { shell(); route(); } adminPoll(); syncPull(); return; }
    if (r.status === 401 || r.status === 403) { authSave(null); USER = null; authScreen(next, r.status === 403 ? r.data.status : "expired"); }
    return;
  }
  authScreen(next);
}
function signOut() { authSave(null); USER = null; location.hash = ""; authScreen(() => { shell(); route(); }); }

/* ---------- sign in / request access ---------- */
const SELL = [
  ["academy", "Learn", "The free Erasmus+ microcourse and the full syllabus of every eMove course."],

function authScreen(next, notice) {
  document.body.innerHTML = `<div class="auth"><section class="auth-side">
      <a href="/" class="brand">${LOGO}</a>
      <h1>Free Erasmus+ training and classroom resources for European teachers.</h1>
      <ul class="sell">${SELL.map(([i, t, d]) => `<li>${icon(i)}<div><b>${t}</b><span>${d}</span></div></li>`).join("")}</ul>

  const card = $("#authCard");
  const tabs = mode => `<div class="tabs"><button data-m="in" class="${mode === "in" ? "on" : ""}">Sign in</button><button data-m="up" class="${mode === "up" ? "on" : ""}">Request access</button></div>`;
  const NOTICE = {
    pending: ["Your request is waiting for approval", "The eMove team reviews every request. Try signing in again once it has been approved."],
    rejected: ["Your request was not approved", `If you think this is a mistake, write to ${EMOVE_MAIL}.`],
    expired: ["Your session has ended", "Please sign in again."]
  };
  const noteHTML = n => NOTICE[n] ? `<div class="notice ${n}"><b>${NOTICE[n][0]}</b><span>${esc(NOTICE[n][1])}</span></div>` : "";
  const signIn = (n) => {
    card.innerHTML = tabs("in") + noteHTML(n) + `<form id="f" class="form" novalidate>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err"></p>
      <button class="btn primary wide">Sign in</button>
      <p class="small center">Forgot your password? Write to <a href="mailto:${EMOVE_MAIL}">${EMOVE_MAIL}</a> and we will reset it.</p></form>`;
    bindTabs();
    $("#f").onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target), b = $("button.primary", card); b.disabled = true; $("#err").textContent = "";
      const r = await api("login", { email: f.get("email"), password: f.get("password") }); b.disabled = false;
      if (r.ok) { authSave({ token: r.data.token, user: r.data.user }); adoptUser(r.data.user); await syncPull(); next(); adminPoll(); return; }
      if (r.status === 403) return signIn(r.data.status);
      $("#err").textContent = r.data.message || "Something went wrong.";
    };
  };
  const requestAccess = () => {
    card.innerHTML = tabs("up") + `<p class="muted">Access is free. Tell us a little about you; the eMove team approves every account.</p>
      <form id="f" class="form" novalidate>
      <label>Full name<input name="name" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <div class="two"><label>School or organisation<input name="school" required></label>
      <label>Country<select name="country" required><option value="">Choose…</option>${COUNTRIES.map(c => `<option>${c}</option>`).join("")}</select></label></div>
      <div class="two"><label>Your role<select name="role">${ROLES.map(([k, t]) => `<option value="${k}">${t}</option>`).join("")}</select></label>
      <label>Stage you teach<select name="stage"><option value="">Choose…</option>${STAGES.map(s => `<option>${s}</option>`).join("")}</select></label></div>
      <label><span>Subject or area <span class="optional">optional</span></span><input name="subject"></label>
      <fieldset><legend>What interests you most? <span class="optional">optional</span></legend><div class="checks">${PATHWAYS.map(p => `<label class="check"><input type="checkbox" name="interests" value="${p.id}"><span>${p.name}</span></label>`).join("")}</div></fieldset>
      <label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label>
      <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
      <label class="check"><input type="checkbox" name="accept" required><span>I accept the <a href="/privacy/" target="_blank">privacy notice</a>: eMove Academy uses my details to manage my access.</span></label>
      <label class="check"><input type="checkbox" name="news"><span>I would like to receive news about Erasmus+ deadlines and eMove courses.</span></label>
      <p class="err" id="err"></p>
      <button class="btn primary wide">Request access</button></form>`;
    bindTabs();
    $("#f").onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target), b = $("button.primary", card); b.disabled = true; $("#err").textContent = "";
      const body = Object.fromEntries(["name", "email", "school", "country", "role", "stage", "subject", "password", "website"].map(k => [k, f.get(k) || ""]));
      Object.assign(body, { interests: f.getAll("interests"), accept: !!f.get("accept"), news: !!f.get("news") });
      const r = await api("register", body); b.disabled = false;
      if (!r.ok) { $("#err").textContent = r.data.message || "Something went wrong."; return; }
      if (r.data.status === "approved") { const l = await api("login", { email: body.email, password: body.password }); if (l.ok) { authSave({ token: l.data.token, user: l.data.user }); adoptUser(l.data.user); next(); adminPoll(); return; } }

/* ---------- sync between devices ---------- */
function mergeState(a, b) {
  if (!b) return a;
  const m = Object.assign(freshState(), a);
  m.xp = Math.max(a.xp || 0, b.xp || 0);
  for (const k of ["done", "units", "clicks", "syl"]) m[k] = Object.assign({}, b[k] || {}, a[k] || {});
  m.notes = Object.assign({}, b.notes || {}); for (const [k, v] of Object.entries(a.notes || {})) if (v) m.notes[k] = v;
  m.favs = [...new Set([...(a.favs || []), ...(b.favs || [])])];
  m.days = [...new Set([...(a.days || []), ...(b.days || [])])].sort();
  m.quiz = [a.quiz, b.quiz].filter(Boolean).sort((x, y) => y.score - x.score)[0] || null;
  const certs = {}; for (const c of [...(b.certs || []), ...(a.certs || [])]) certs[c.id] = c; m.certs = Object.values(certs);
  const seen = new Set(); m.log = [...(a.log || []), ...(b.log || [])].filter(x => { const k = x.t + x.d; if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 40);
  return m;
}
function setRev(r) { REV = r; try { localStorage.setItem(KEY + ":rev:" + S.owner, String(r)); } catch (e) { } }
async function syncPull() {
  if (PREVIEW || !AUTH) return;
  const r = await api("data"); if (!r.ok) return;
  if (r.data.state) { const owner = S.owner; S = mergeState(S, r.data.state); S.owner = owner; save(false); }
  setRev(r.data.rev || 0);
  if (!r.data.state || JSON.stringify(r.data.state) !== JSON.stringify(S)) syncPush(true);
  if ($("#view")) route();
}
let syncT = null;
function syncPush(now) {
  if (PREVIEW || !AUTH) return;
  clearTimeout(syncT);
  syncT = setTimeout(async () => {
    const r = await api("data", { base: REV, state: S }, "PUT");
    if (r.ok) return setRev(r.data.rev);
    if (r.status === 409) { const owner = S.owner; S = mergeState(S, r.data.state); S.owner = owner; save(false); setRev(r.data.rev); const r2 = await api("data", { base: REV, state: S }, "PUT"); if (r2.ok) setRev(r2.data.rev); }
  }, now ? 0 : 1500);
}

      <div class="buckets" style="--n:${a.buckets.length}">${a.buckets.map((b, bi) => `<div class="bucket" data-b="${bi}"><b>${esc(b)}</b>${items.filter(it => place[it.k] === bi).map(it => `<button class="tile in ${h.dataset.locked ? (it.b === bi ? "right" : "wrong") : ""}" data-k="${it.k}">${esc(it.t)}${h.dataset.locked && it.b !== bi ? `<small>→ ${esc(a.buckets[it.b])}</small>` : ""}</button>`).join("")}</div>`).join("")}</div><div id="fb"></div>`;
    if (h.dataset.locked) return;
    $$(".pool .tile", h).forEach(t => t.onclick = () => { sel = +t.dataset.k; draw(); });
    $$(".bucket", h).forEach(b => b.onclick = e => {
      const t = e.target.closest(".tile.in");
      if (sel != null) { place[sel] = +b.dataset.b; sel = null; draw(); return; }
      if (t) { delete place[t.dataset.k]; draw(); }
    });
    const btn = foot.firstChild; btn.disabled = Object.keys(place).length < items.length;
  };
  foot.innerHTML = `<button class="btn primary wide" disabled>Check</button>`;
  foot.firstChild.onclick = () => {
    h.dataset.locked = 1; const ok = items.every(it => place[it.k] === it.b); draw();
    $("#fb", h).innerHTML = feedback(ok, `<b>${ok ? "Perfect!" : `${items.filter(it => place[it.k] === it.b).length} of ${items.length} in the right box.`}</b> ${md(a.explain || "")}`);
    finish(ok);
  };
  draw();
};
ACT.order = (h, a, foot, finish) => {
  let list = shuffle(a.steps.map((t, k) => ({ t, k })));
  if (list.every((x, i) => x.k === i)) list.reverse();
  const draw = () => {
    const locked = !!h.dataset.locked;
    h.innerHTML = `<span class="eyebrow">${icon("route")} Order</span><h2>${esc(a.q)}</h2><p class="muted small">Use the arrows to move each step.</p>
      <ol class="order">${list.map((x, i) => `<li class="${locked ? (x.k === i ? "right" : "wrong") : ""}"><span class="num">${i + 1}</span><span class="t">${esc(x.t)}</span>${locked ? (x.k === i ? icon("check") : `<small>should be ${x.k + 1}</small>`) : `<span class="mv"><button data-i="${i}" data-d="-1" aria-label="Move up" ${i ? "" : "disabled"}>↑</button><button data-i="${i}" data-d="1" aria-label="Move down" ${i < list.length - 1 ? "" : "disabled"}>↓</button></span>`}</li>`).join("")}</ol><div id="fb"></div>`;
    $$(".mv button", h).forEach(b => b.onclick = () => { const i = +b.dataset.i, j = i + +b.dataset.d; [list[i], list[j]] = [list[j], list[i]]; draw(); });
  };
  foot.innerHTML = `<button class="btn primary wide">Check</button>`;
  foot.firstChild.onclick = () => {
    h.dataset.locked = 1; const ok = list.every((x, i) => x.k === i); draw();
    $("#fb", h).innerHTML = feedback(ok, `<b>${ok ? "Right order!" : "Here is the right order."}</b> ${ok ? "" : `<ol class="small">${a.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>`}${md(a.explain || "")}`);
    finish(ok);
  };
  draw();
};
ACT.reflect = (h, a, foot, finish, id) => {
  h.innerHTML = `<span class="eyebrow">${icon("note")} Reflect</span><h2>${esc(a.q)}</h2><textarea id="note" rows="5" placeholder="${esc(a.placeholder || "")}">${esc(S.notes[id] || "")}</textarea><p class="muted small">Your answer is saved in <b>Profile › My notes</b>. Only you can see it.</p>`;

/* ---------- final quiz and certificate ---------- */
const passMark = () => Math.ceil(COURSE().quiz.length * 0.75);
ROUTES.quiz = v => {
  const c = COURSE();
  if (!allUnitsDone()) { toast("Complete all the units to unlock the quiz."); return go("academy"); }
  let i = 0, score = 0;
  const qs = c.quiz.map(q => { const order = shuffle(q.options.map((o, k) => k)); return { q: q.q, options: order.map(k => q.options[k]), answer: order.indexOf(q.answer) }; });
  const draw = () => {
    if (i === qs.length) return result();
    const q = qs[i];
    v.innerHTML = `<div class="player"><div class="player-top"><a href="#academy" class="icon-btn" aria-label="Close quiz">${icon("close")}</a><div class="steps">${qs.map((_, k) => `<i class="${k < i ? "done" : ""} ${k === i ? "now" : ""}"></i>`).join("")}</div><span class="xp-pill">${score}/${qs.length}</span></div>
      <div class="act card"><span class="eyebrow">${icon("quiz")} Final quiz · question ${i + 1} of ${qs.length}</span><h2>${esc(q.q)}</h2><div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="opt-l">${"ABC"[k]}</span><span>${esc(o)}</span></button>`).join("")}</div></div><div class="player-foot" id="foot"></div></div>`;
    $$(".opt", v).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = k === q.answer; if (ok) score++;
      $$(".opt", v).forEach(x => { x.disabled = true; x.classList.toggle("right", +x.dataset.k === q.answer); x.classList.toggle("wrong", +x.dataset.k === k && !ok); });
      $("#foot").innerHTML = `<button class="btn primary wide">${i === qs.length - 1 ? "See result" : "Next question"} ${icon("arrow")}</button>`;
      $("#foot button").onclick = () => { i++; draw(); };
    });
  };
  const result = () => {
    const pass = score >= passMark(), prev = S.quiz;
    if (!prev || score > prev.score) S.quiz = { score, of: qs.length, pass, d: todayISO() };
    if (pass && !S.certs.some(x => x.id === c.id)) { S.certs.push({ id: c.id, title: c.title, name: USER.name, d: todayISO(), score }); addXP(50, `Certificate earned: ${c.title}`); }
    else save();
    v.innerHTML = `<div class="celebrate card"><div class="medal ${pass ? "" : "grey"}">${icon(pass ? "cert" : "quiz")}</div><h1>${pass ? "You passed!" : "Almost there"}</h1><p class="big-score">${score} / ${qs.length}</p>
      <p>${pass ? "Your certificate is ready." : `You need ${passMark()} correct answers. Review the units and try again.`}</p>
      <div class="row gap center">${pass ? `<a class="btn primary" href="#cert/${c.id}">${icon("cert")} View certificate</a>` : `<a class="btn primary" href="#quiz" onclick="setTimeout(route)">Try again</a>`}<a class="btn" href="#academy">Course map</a></div></div>
      ${pass ? `<div class="card tip-course"><p><b>Next step:</b> put it into practice. Your school can use an Erasmus+ grant to send you on an eMove course.</p>${courseCTA(pickCourse().pathway)}</div>` : ""}`;
  };
  draw();
};

/* the programmes are written as short lines: bullet runs become lists, the rest paragraphs */
function prose(lines, cls = "") {
  let out = "", ul = [];
  const flush = () => { if (ul.length) { out += `<ul>${ul.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`; ul = []; } };
  for (const l of lines || []) {
    if (l.startsWith("* ")) { ul.push(l.slice(2)); continue; }
    flush();
    out += /^[A-Z0-9 ·&’'“”.!?:,+-]{6,}$/.test(l) && l.toUpperCase() === l ? `<p class="shout">${esc(l)}</p>` : `<p>${esc(l)}</p>`;
  }
  flush();
  return `<div class="prose ${cls}">${out}</div>`;
}
const titleCase = s => s.charAt(0) + s.slice(1).toLowerCase().replace(/\b(ai|eu|ka\d+|vet)\b/g, m => m.toUpperCase());

const ago = s => {
  const m = Math.round((Date.now() - new Date(s)) / 6e4);
  return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : m < 10080 ? Math.round(m / 1440) + " d ago" : new Date(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
};
const avatar = name => { const parts = String(name || "?").trim().split(/\s+/), hue = [...String(name)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 360; return `<span class="avatar" style="--h:${hue}">${esc((parts[0][0] || "?") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase()}</span>`; };

const postHTML = t => esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '<a href="$1" target="_blank" rel="noopener nofollow ugc">$1</a>').replace(/\n/g, "<br>");

/* list of the discussions of one space, with a button to start a new one */
async function forumBlock(el, sid) {
  const sp = spaceById(sid);
  if (PREVIEW) return offline(el);
  el.innerHTML = `<div class="forum-h"><div><h2>${icon("chat")} Discussions</h2><p class="muted small">${esc(sp.line)}</p></div><button class="btn primary" id="newt">${icon("plus")} New discussion</button></div><div id="tl"><p class="muted">Loading…</p></div>`;
  $("#newt", el).onclick = () => newThread(sid);
  const r = await api("forum?space=" + encodeURIComponent(sid));
  const tl = $("#tl", el); if (!tl) return;
  if (!r.ok) { tl.innerHTML = `<p class="err">${esc(r.data.message || "Could not load the discussions.")}</p>`; return; }
  tl.innerHTML = r.data.threads.length ? `<ul class="threads">${r.data.threads.map(t => `<li><a href="#thread/${t.id}" class="thread-row">${avatar(t.by.name)}<div class="grow"><b>${t.pin ? `${icon("flag")} ` : ""}${esc(t.title)}</b><p class="muted">${esc(t.excerpt)}</p><small>${byLine(t.by)} · ${ago(t.at)}</small></div><span class="replies">${icon("chat")} ${t.n}</span></a></li>`).join("")}</ul>`
    : `<div class="empty-forum">${icon("chat", "big")}<p><b>No discussions yet.</b><br>Start the first one: ask a question, share an idea or introduce yourself.</p></div>`;
}
function newThread(sid) {
  const sp = spaceById(sid);
  const s = sheet(`<h2>New discussion</h2><p class="muted small">${icon(sp.icon)} ${esc(sp.name)}. Everyone with an approved account can read it.</p>
    <form class="form" id="nt"><label>Title<input name="title" maxlength="140" required placeholder="${sid === "partners" ? "Primary school in Lyon looking for an eTwinning partner" : sid === "erasmus" ? "How many participants can a KA122 project have?" : "What is your question or idea?"}"></label>
    <label>Message<textarea name="body" rows="6" maxlength="5000" required placeholder="Give enough context so others can help: your stage, subject, country…"></textarea></label>
    <p class="muted small">Be kind and don't share students' personal data.</p><p class="err" id="nte"></p><button class="btn primary">${icon("send")} Publish</button></form>`);
  $("#nt", s).onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target), b = $("button", e.target); b.disabled = true;
    const r = await api("forum/thread", { space: sid, title: f.get("title"), body: f.get("body") });

    closeSheet(); if (!S.done["post-first"]) { S.done["post-first"] = { d: todayISO() }; addXP(15, "Started a discussion"); }
    go("thread/" + r.data.id);
  };
}

  if (cn.ok) for (const [k, x] of Object.entries(cn.data.counts)) { const el = $(`[data-space-n="${k}"]`); if (el) el.textContent = x.threads ? `${x.threads} discussion${x.threads > 1 ? "s" : ""} · ${ago(x.last)}` : "No discussions yet"; }
};
const spaceCard = s => { const c = s.course && courseById(s.course), col = c ? pathwayById(c.pathway).color : "#1965B8"; return `<a class="card space" href="#space/${s.id}" style="--c:${col}">${icon(s.icon)}<div class="grow"><b>${esc(s.name)}</b><span class="muted">${esc(c ? c.sub : s.line)}</span><small data-space-n="${s.id}"></small></div>${icon("arrow")}</a>`; };
const recentList = items => `<ul class="recent">${items.map(x => `<li><a href="#thread/${x.id}">${avatar(x.name)}<div><span><b>${esc(x.name)}</b> ${x.kind === "thread" ? "started" : "replied to"} <b>${esc(x.title)}</b></span><small>${esc((spaceById(x.space) || {}).name || "")} · ${ago(x.at)}</small></div></a></li>`).join("")}</ul>`;

ROUTES.space = (v, [sid]) => {
  const sp = spaceById(sid); if (!sp) return go("community");
  const c = sp.course && courseById(sp.course);
  v.innerHTML = `<a class="back" href="#community">${icon("back")} Community</a><div class="page-h"><h1>${icon(sp.icon)} ${esc(sp.name)}</h1><p class="muted">${esc(sp.line)}</p>${c ? `<a class="link" href="#course/${c.id}">Syllabus and resources of ${esc(c.title)} ${icon("arrow")}</a>` : ""}</div><div id="forum"></div>`;
  forumBlock($("#forum"), sid);
};

ROUTES.thread = async (v, [tid]) => {
  if (PREVIEW) return offline(v);
  v.innerHTML = `<p class="muted">Loading…</p>`;
  const r = await api("forum/thread?id=" + encodeURIComponent(tid));
  if (!r.ok) { v.innerHTML = `<a class="back" href="#community">${icon("back")} Community</a><p class="err">${esc(r.data.message || "Could not load this discussion.")}</p>`; return; }
  const t = r.data.thread, mod = r.data.mod, sp = spaceById(t.space) || { name: "Community", icon: "chat" };
  const back = sp.course ? `#course/${sp.course}/community` : `#space/${t.space}`;
  v.innerHTML = `<a class="back" href="${back}">${icon("back")} ${esc(sp.name)}</a>
    <div class="page-h"><h1>${t.pin ? icon("flag") + " " : ""}${esc(t.title)}</h1><p class="muted small">${icon(sp.icon)} ${esc(sp.name)} · ${t.posts.length - 1} repl${t.posts.length === 2 ? "y" : "ies"}</p></div>
    <ol class="posts">${t.posts.map((p, i) => `<li class="card post ${i === 0 ? "op" : ""}" id="${p.id}">${avatar(p.by.name)}<div class="grow"><div class="post-h"><span><b>${byLine(p.by)}</b>${p.by.school ? `<small class="muted"> · ${esc(p.by.school)}</small>` : ""}</span><small class="muted">${ago(p.at)}</small></div>
      <div class="post-b">${postHTML(p.body)}</div>${p.by.mine || mod ? `<div class="post-a">${mod && i === 0 ? `<button class="link" data-pin>${icon("flag")} ${t.pin ? "Unpin" : "Pin"}</button>` : ""}<button class="link danger" data-del="${p.id}">${icon("trash")} Delete</button></div>` : ""}</div></li>`).join("")}</ol>
    <section class="card reply"><h3>Reply</h3><form class="form" id="rp"><textarea name="body" rows="4" maxlength="5000" required placeholder="Write your reply…"></textarea><p class="err" id="rpe"></p><button class="btn primary">${icon("send")} Send reply</button></form></section>`;
  $("#rp").onsubmit = async e => {
    e.preventDefault(); const b = $("button", e.target); b.disabled = true;
    const r2 = await api("forum/reply", { id: t.id, body: new FormData(e.target).get("body") });
    if (!r2.ok) { $("#rpe").textContent = r2.data.message || "Could not send."; b.disabled = false; return; }
    if (!S.done["reply-first"]) { S.done["reply-first"] = { d: todayISO() }; addXP(10, "Replied in the community"); }
    route();
  };
  $$("[data-del]").forEach(b => b.onclick = async () => {
    const op = b.dataset.del === "p0";
    if (!confirm(op ? "Delete this discussion?" : "Delete this message?")) return;
    const r2 = await api("forum/delete", { id: t.id, post: b.dataset.del });
    if (!r2.ok) return toast(r2.data.message || "Could not delete.");
    toast("Deleted"); op ? (location.hash = back) : route();
  });
  const pin = $("[data-pin]"); if (pin) pin.onclick = async () => { const r2 = await api("forum/pin", { id: t.id }); r2.ok ? route() : toast(r2.data.message || "Could not do that."); };
};

/* ---------- teacher directory ---------- */
let DIR_F = { q: "", country: "", looking: "", course: "" };
ROUTES.members = async v => {
  v.innerHTML = `<a class="back" href="#community">${icon("back")} Community</a><div class="page-h"><h1>${icon("users")} Teacher directory</h1><p class="muted">Teachers who chose to appear here. Find colleagues for Erasmus+ projects, eTwinning or job shadowing.</p></div><div id="dir"><p class="muted">Loading…</p></div>`;
  if (PREVIEW) return offline($("#dir"));
  const r = await api("members");
  if (!r.ok) { $("#dir").innerHTML = `<p class="err">${esc(r.data.message || "Could not load the directory.")}</p>`; return; }
  const all = r.data.members;
  $("#dir").innerHTML = `${USER.directory ? "" : `<section class="card join-dir">${icon("user", "big")}<div class="grow"><h3>You're not in the directory yet</h3><p class="muted">Add a short presentation and say what you are looking for, so other teachers can find you.</p></div><a class="btn primary" href="#profile/community">Join the directory</a></section>`}
    <div class="filters"><div class="frow"><label class="search">${icon("search")}<input id="dq" placeholder="Search name, school, subject…" value="${esc(DIR_F.q)}"></label>
      <select id="dc"><option value="">All countries</option>${[...new Set(all.map(m => m.country).filter(Boolean))].sort().map(c => `<option ${DIR_F.country === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <select id="dl"><option value="">Looking for anything</option>${LOOKING.map(([k, t]) => `<option value="${k}" ${DIR_F.looking === k ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <select id="dk"><option value="">Any eMove course</option>${EMOVE_COURSES.map(c => `<option value="${c.id}" ${DIR_F.course === c.id ? "selected" : ""}>${esc(c.title)}</option>`).join("")}</select></div></div>
    <p class="muted small" id="dn"></p><div class="grid3" id="dlist"></div>`;
  const draw = () => {
    const q = DIR_F.q.toLowerCase();
    const list = all.filter(m => (!DIR_F.country || m.country === DIR_F.country) && (!DIR_F.looking || m.looking.includes(DIR_F.looking)) && (!DIR_F.course || m.going.includes(DIR_F.course))
      && (!q || [m.name, m.school, m.subject, m.bio, m.stage].join(" ").toLowerCase().includes(q)));
    $("#dn").textContent = `${list.length} of ${all.length} teacher${all.length === 1 ? "" : "s"}`;
    $("#dlist").innerHTML = list.map(memberCard).join("") || `<p class="muted empty">No teachers match these filters.</p>`;
  };
  $("#dq").oninput = e => { DIR_F.q = e.target.value; draw(); };
  $("#dc").onchange = e => { DIR_F.country = e.target.value; draw(); };
  $("#dl").onchange = e => { DIR_F.looking = e.target.value; draw(); };
  $("#dk").onchange = e => { DIR_F.course = e.target.value; draw(); };
  draw();
};
const memberCard = m => `<article class="card member">${avatar(m.name)}<div class="grow"><b>${esc(m.name)}${m.me ? " (you)" : ""}${m.team ? ` <span class="team">eMove team</span>` : ""}</b>
  <small class="muted">${esc([ROLE_NAME[m.role] || "", m.subject, m.stage].filter(Boolean).join(" · "))}</small><small>${icon("school")} ${esc([m.school, m.country].filter(Boolean).join(", "))}</small>
  ${m.bio ? `<p>${esc(m.bio)}</p>` : ""}
  ${m.looking.length ? `<div class="tags">${m.looking.map(k => `<span class="tag">${esc(LOOKING_NAME[k] || k)}</span>`).join("")}</div>` : ""}
  ${m.going.length ? `<small>${icon("plane")} Interested in ${m.going.map(id => `<a href="#course/${id}">${esc((courseById(id) || {}).title || id)}</a>`).join(", ")}</small>` : ""}
  ${m.email && !m.me ? `<a class="btn sm" href="mailto:${esc(m.email)}">${icon("mail")} Email</a>` : ""}</div></article>`;

document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", start) : start();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js");
</script></body></html>
